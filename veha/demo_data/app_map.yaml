# Карта интеграций демонстрационного ландшафта «Сеть N».
#
# ВСЁ ВЫМЫШЛЕНО. Файл создаётся generate.py вместе с артефактами —
# так карта и снятые данные не расходятся.
#
# id узлов: screen:<key>, ui:<testid>, api:<METHOD /path>, topic:<name>,
#           store:<name>, svc:<name>

services:
  storefront-api:
    label: "storefront-api"
    kind: backend
    note: "основной API витрины"
  checkout-worker:
    label: "checkout-worker"
    kind: backend
    note: "оплата заказа, общается через шину"
  warehouse-worker:
    label: "warehouse-worker"
    kind: backend
    note: "остатки и резервы"
  billing-worker:
    label: "billing-worker"
    kind: backend
    note: "счета и возвраты"
  crm-worker:
    label: "crm-worker"
    kind: backend
    note: "сегменты и бонусы"
  notifier:
    label: "notifier"
    kind: backend
    note: "рассылка уведомлений"
  identity:
    label: "Провайдер входа"
    kind: auth
  db-primary:
    label: "PostgreSQL «shop»"
    kind: db
  broker:
    label: "Шина сообщений"
    kind: bus
  objectstore:
    label: "Объектное хранилище"
    kind: storage

screens:
  catalog_products:
    label: "Каталог товаров"
    path: "/#/catalog/products"
    page_object: src/ui/pages/catalog_products_page.py
    frame:
      - {kind: "sidebar", x: 0, y: 0, w: 8, h: 100}
      - {kind: "header", x: 8, y: 0, w: 92, h: 11, label: "Каталог товаров"}
      - {kind: "toolbar", x: 11, y: 14, w: 46, h: 9}
      - {kind: "button", x: 78, y: 14, w: 19, h: 9, label: "Добавить товар"}
      - {kind: "table", x: 11, y: 28, w: 86, h: 66, rows: 8, label: "SKU · Название · Категория · Цена"}
  product_card:
    label: "Карточка товара"
    path: "/#/catalog/products/{productId}"
    page_object: src/ui/pages/product_card_page.py
    frame:
      - {kind: "sidebar", x: 0, y: 0, w: 8, h: 100}
      - {kind: "hero", x: 8, y: 0, w: 92, h: 24, label: "Карточка товара"}
      - {kind: "button", x: 76, y: 5, w: 20, h: 9, label: "Добавить вариант"}
      - {kind: "panel", x: 11, y: 28, w: 42, h: 34, label: "Параметры товара"}
      - {kind: "panel", x: 56, y: 28, w: 41, h: 34, label: "Остатки по складам"}
      - {kind: "table", x: 11, y: 66, w: 86, h: 30, rows: 4, label: "Вариант · Штрихкод · Цена"}
  orders_list:
    label: "Заказы"
    path: "/#/orders"
    page_object: src/ui/pages/orders_page.py
    frame:
      - {kind: "sidebar", x: 0, y: 0, w: 8, h: 100}
      - {kind: "header", x: 8, y: 0, w: 92, h: 11, label: "Заказы"}
      - {kind: "toolbar", x: 11, y: 14, w: 40, h: 9}
      - {kind: "button", x: 76, y: 14, w: 21, h: 9, label: "Новый заказ"}
      - {kind: "table", x: 11, y: 28, w: 86, h: 66, rows: 9, label: "Номер · Клиент · Статус · Сумма"}
  order_card:
    label: "Карточка заказа"
    path: "/#/orders/{orderId}"
    page_object: src/ui/pages/order_card_page.py
    frame:
      - {kind: "sidebar", x: 0, y: 0, w: 8, h: 100}
      - {kind: "hero", x: 8, y: 0, w: 92, h: 22, label: "Заказ"}
      - {kind: "button", x: 76, y: 5, w: 20, h: 9, label: "Подтвердить"}
      - {kind: "panel", x: 11, y: 26, w: 42, h: 30, label: "Оплата"}
      - {kind: "panel", x: 56, y: 26, w: 41, h: 30, label: "Отгрузка"}
      - {kind: "table", x: 11, y: 60, w: 86, h: 36, rows: 5, label: "Товар · Кол-во · Цена · Скидка"}
  warehouse_stock:
    label: "Остатки на складе"
    path: "/#/warehouse/stock"
    page_object: src/ui/pages/warehouse_stock_page.py
    frame:
      - {kind: "sidebar", x: 0, y: 0, w: 8, h: 100}
      - {kind: "header", x: 8, y: 0, w: 92, h: 11, label: "Остатки"}
      - {kind: "toolbar", x: 11, y: 14, w: 52, h: 9}
      - {kind: "button", x: 78, y: 14, w: 19, h: 9, label: "Перемещение"}
      - {kind: "table", x: 11, y: 28, w: 86, h: 66, rows: 8, label: "Склад · Вариант · Остаток · Резерв"}
  purchase_order:
    label: "Закупка"
    path: "/#/warehouse/purchases/{purchaseId}"
    page_object: src/ui/pages/purchase_order_page.py
    frame:
      - {kind: "sidebar", x: 0, y: 0, w: 8, h: 100}
      - {kind: "header", x: 8, y: 0, w: 92, h: 12, label: "Закупка"}
      - {kind: "panel", x: 11, y: 16, w: 42, h: 36, label: "Поставщик и условия"}
      - {kind: "panel", x: 56, y: 16, w: 41, h: 36, label: "Приёмка"}
      - {kind: "table", x: 11, y: 56, w: 86, h: 40, rows: 5, label: "Вариант · Кол-во · Цена"}
  billing_invoices:
    label: "Счета"
    path: "/#/billing/invoices"
    page_object: src/ui/pages/billing_invoices_page.py
    frame:
      - {kind: "sidebar", x: 0, y: 0, w: 8, h: 100}
      - {kind: "header", x: 8, y: 0, w: 92, h: 11, label: "Счета"}
      - {kind: "toolbar", x: 11, y: 14, w: 46, h: 9}
      - {kind: "button", x: 78, y: 14, w: 19, h: 9, label: "Выставить счёт"}
      - {kind: "table", x: 11, y: 28, w: 86, h: 66, rows: 7, label: "Счёт · Заказ · Статус · Сумма"}
  crm_customers:
    label: "Клиенты"
    path: "/#/crm/customers"
    page_object: src/ui/pages/crm_customers_page.py
    frame:
      - {kind: "sidebar", x: 0, y: 0, w: 8, h: 100}
      - {kind: "header", x: 8, y: 0, w: 92, h: 11, label: "Клиенты"}
      - {kind: "toolbar", x: 11, y: 14, w: 52, h: 9}
      - {kind: "table", x: 11, y: 28, w: 86, h: 66, rows: 8, label: "Клиент · Сегмент · Бонусы · Статус"}
  crm_campaigns:
    label: "Кампании"
    path: "/#/crm/campaigns"
    page_object: src/ui/pages/crm_campaigns_page.py
    frame:
      - {kind: "sidebar", x: 0, y: 0, w: 8, h: 100}
      - {kind: "header", x: 8, y: 0, w: 92, h: 11, label: "Кампании"}
      - {kind: "button", x: 76, y: 14, w: 21, h: 9, label: "Новая кампания"}
      - {kind: "table", x: 11, y: 28, w: 86, h: 66, rows: 6, label: "Кампания · Сегмент · Статус"}
  admin_accounts:
    label: "Учётные записи"
    path: "/#/admin/accounts"
    page_object: src/ui/pages/admin_accounts_page.py
    frame:
      - {kind: "sidebar", x: 0, y: 0, w: 8, h: 100}
      - {kind: "header", x: 8, y: 0, w: 92, h: 11, label: "Учётные записи"}
      - {kind: "toolbar", x: 11, y: 14, w: 52, h: 9}
      - {kind: "table", x: 11, y: 28, w: 86, h: 66, rows: 7, label: "Логин · ФИО · Роль · Статус"}
  reports_sales:
    label: "Отчёт по продажам"
    path: "/#/reports/sales"
    page_object: src/ui/pages/reports_sales_page.py
    frame:
      - {kind: "sidebar", x: 0, y: 0, w: 8, h: 100}
      - {kind: "header", x: 8, y: 0, w: 92, h: 11, label: "Продажи"}
      - {kind: "toolbar", x: 11, y: 14, w: 40, h: 9}
      - {kind: "panel", x: 11, y: 26, w: 86, h: 44, label: "Динамика продаж"}
      - {kind: "table", x: 11, y: 72, w: 86, h: 24, rows: 3, label: "Период · Заказов · Выручка"}

# Элементы UI и эндпоинты, которые они дёргают.
ui_elements:
  - testid: catalog-products-table
    slot: {x: 54, y: 60}
    screen: catalog_products
    label: "Таблица товаров"
    calls:
      - "GET /api/v1/products"
    renders: ["таблица товаров"]
  - testid: catalog-create-product-btn
    slot: {x: 87, y: 18}
    screen: catalog_products
    label: "Добавить товар"
    calls:
      - "GET /api/v1/categories"
      - "POST /api/v1/products"
      - "POST /api/v1/prices"
    renders: ["модалка «Новый товар»", "шаг «Цена и остаток»"]
    note: "визард из двух шагов; цена создаётся отдельным POST"
  - testid: catalog-filter-category
    slot: {x: 30, y: 18}
    screen: catalog_products
    label: "Фильтр по категории"
    calls:
      - "GET /api/v1/categories/tree"
    renders: ["выпадающее дерево категорий"]
  - testid: catalog-search-input
    slot: {x: 18, y: 18}
    screen: catalog_products
    label: "Поиск по каталогу"
    calls:
      - "GET /api/v1/products/search"
    renders: ["подсказки поиска"]
  - testid: product-summary-panel
    slot: {x: 32, y: 44}
    screen: product_card
    label: "Параметры товара"
    calls:
      - "GET /api/v1/products/{id}"
      - "GET /api/v1/enums/units"
    renders: ["название, категория, единица"]
  - testid: product-variants-table
    slot: {x: 54, y: 80}
    screen: product_card
    label: "Таблица вариантов"
    calls:
      - "GET /api/v1/products/{id}/variants"
    renders: ["грид вариантов"]
  - testid: product-add-variant-btn
    slot: {x: 86, y: 9}
    screen: product_card
    label: "Добавить вариант"
    calls:
      - "POST /api/v1/variants"
    renders: ["модалка «Новый вариант»"]
  - testid: product-stock-widget
    slot: {x: 76, y: 44}
    screen: product_card
    label: "Остатки по складам"
    calls:
      - "GET /api/v1/stock/product/{productId}"
    renders: ["полоски остатка по складам"]
  - testid: product-price-input
    slot: {x: 40, y: 50}
    screen: product_card
    label: "Цена товара"
    calls:
      - "PUT /api/v1/prices/{id}"
    renders: ["подсказка «цена обновлена»"]
    note: "отрицательная цена → 400, поле краснеет"
  - testid: orders-table
    slot: {x: 54, y: 60}
    screen: orders_list
    label: "Список заказов"
    calls:
      - "GET /api/v1/orders"
    renders: ["таблица заказов"]
  - testid: orders-filter-status
    slot: {x: 24, y: 18}
    screen: orders_list
    label: "Фильтр по статусу"
    calls:
      - "GET /api/v1/enums/order-statuses"
    renders: ["набор чипов статусов"]
  - testid: orders-create-btn
    slot: {x: 86, y: 18}
    screen: orders_list
    label: "Новый заказ"
    calls:
      - "GET /api/v1/customers"
      - "POST /api/v1/carts"
      - "POST /api/v1/carts/{id}/items"
      - "POST /api/v1/orders"
    renders: ["модалка «Новый заказ»"]
    note: "каскад Клиент → Корзина → Позиции → Заказ"
  - testid: orders-export-btn
    slot: {x: 66, y: 18}
    screen: orders_list
    label: "Выгрузить реестр"
    calls:
      - "POST /api/v1/orders/export"
    renders: ["тост «Файл готов»"]
  - testid: order-header-panel
    slot: {x: 32, y: 12}
    screen: order_card
    label: "Шапка заказа"
    calls:
      - "GET /api/v1/orders/{id}"
    renders: ["номер, клиент, статус"]
  - testid: order-lines-table
    slot: {x: 54, y: 78}
    screen: order_card
    label: "Строки заказа"
    calls:
      - "GET /api/v1/orders/{id}/lines"
    renders: ["грид строк"]
  - testid: order-confirm-btn
    slot: {x: 86, y: 9}
    screen: order_card
    label: "Подтвердить заказ"
    calls:
      - "POST /api/v1/orders/{id}/confirm"
    renders: ["статус «Подтверждён»", "плашка «Ожидается оплата»"]
    note: "после подтверждения событие уходит в шину"
  - testid: order-cancel-btn
    slot: {x: 66, y: 9}
    screen: order_card
    label: "Отменить заказ"
