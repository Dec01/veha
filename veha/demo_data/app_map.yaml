    label: "Выгрузить"
    calls:
      - "POST /api/v1/orders/export"
    renders: ["файл выгрузки"]

integrations:
  - from: "POST /api/v1/orders/{id}/confirm"
    kind: publish
    to: topic:order.confirmed
    label: "публикует подтверждение заказа"
  - from: "POST /api/v1/orders/{id}/cancel"
    kind: publish
    to: topic:order.cancelled
    label: "публикует отмену"
  - from: "topic:order.confirmed"
    kind: consume
    to: svc:checkout-worker
    label: "забирает заказ в оплату"
  - from: "svc:checkout-worker"
    kind: publish
    to: topic:payment.authorized
    label: "результат авторизации"
  - from: "svc:checkout-worker"
    kind: publish
    to: topic:payment.failed
    label: "отказ платёжного шлюза"
  - from: "topic:payment.authorized"
    kind: consume
    to: svc:billing-worker
    label: "выписывает счёт"
  - from: "svc:billing-worker"
    kind: publish
    to: topic:invoice.issued
    label: "счёт выписан"
  - from: "topic:invoice.issued"
    kind: consume
    to: svc:notifier
    label: "уведомляет клиента"
  - from: "svc:notifier"
    kind: publish
    to: topic:notification.sent
    label: "факт отправки"
  - from: "POST /api/v1/shipments"
    kind: publish
    to: topic:shipment.created
    label: "публикует отгрузку"
  - from: "topic:shipment.created"
    kind: consume
    to: svc:warehouse-worker
    label: "резервирует остаток"
  - from: "svc:warehouse-worker"
    kind: publish
    to: topic:stock.reserved
    label: "резерв поставлен"
  - from: "POST /api/v1/purchases/{id}/receive"
    kind: publish
    to: topic:stock.replenished
    label: "приёмка поставки"
  - from: "topic:stock.replenished"
    kind: consume
    to: svc:warehouse-worker
    label: "приходует остаток"
  - from: "POST /api/v1/returns"
    kind: publish
    to: topic:return.requested
    label: "публикует заявку на возврат"
  - from: "topic:return.requested"
    kind: consume
    to: svc:billing-worker
    label: "готовит возврат оплаты"
  - from: "POST /api/v1/campaigns/{id}/launch"
    kind: publish
    to: topic:campaign.launched
    label: "запуск рассылки"
  - from: "topic:campaign.launched"
    kind: consume
    to: svc:crm-worker
    label: "разворачивает аудиторию"
  - from: "svc:crm-worker"
    kind: publish
    to: topic:loyalty.points.awarded
    label: "начисление бонусов"
  - from: "topic:loyalty.points.awarded"
    kind: consume
    to: svc:notifier
    label: "уведомление о бонусах"
  - from: "POST /api/v1/orders/export"
    kind: storage
    to: store:objectstore
    label: "кладёт выгрузку в бакет"
  - from: "POST /api/v1/invoices/{id}/send"
    kind: storage
    to: store:objectstore
    label: "сохраняет PDF счёта"

