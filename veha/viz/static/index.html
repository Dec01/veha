<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Веха — карта тестирования</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<!-- Одна строка, как у partest.ru: знак, пять разделов, поиск. Всё остальное
     живёт внутри раздела, а не в шапке. -->
<header class="app-header">
  <a class="brand" href="#" data-section="map" title="Веха — карта">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect class="m-bg" width="32" height="32" rx="7"/><path class="m-p" d="M8 9.5V26M8 14.5a5 5 0 1 0 10 0a5 5 0 1 0 -10 0" fill="none" stroke-width="3" stroke-linecap="round"/><rect class="m-c" x="21.5" y="9" width="4.5" height="11" rx="1"/></svg>
    <span>Веха</span>
  </a>
  <nav class="groups" id="sections" aria-label="Разделы">
    <button data-section="map" aria-current="page">Карта</button>
    <button data-section="cov">Покрытие</button>
    <button data-section="sys">Система</button>
    <button data-section="req">Требования</button>
    <button data-section="run">Прогон<b class="n" id="run-badge"></b></button>
  </nav>
  <span class="spacer"></span>
  <div class="search">
    <input type="search" id="q" placeholder="Эндпоинт, таблица, экран…" autocomplete="off" aria-label="Поиск по карте">
    <kbd class="key">/</kbd>
    <div class="ac" id="ac"></div>
  </div>
  <button class="btn" id="refresh" title="Пересобрать граф из артефактов">Обновить данные</button>
</header>

<!-- Оговорки о данных: область, непрочитанные артефакты, частичный прогон. Пусто — не видно. -->
<div class="notes" id="stats"></div>

<!-- Раздел «Карта»: сцена и постоянная колонка справа (сводка или карточка узла) -->
<section class="view-map" id="view-map">
  <div class="tools">
    <div class="pills" id="pills" role="group" aria-label="Что подсветить"></div>
    <span class="filter-note" id="filter-note" hidden></span>
    <span class="spacer"></span>
    <label class="lbl" for="domain">Домен</label>
    <select id="domain"></select>
    <span class="lbl">Вид</span>
    <span class="seg" role="group" aria-label="Вид карты">
      <button data-view="map" aria-pressed="true" title="Слои по ходу запроса (1)">Слои</button>
      <button data-view="volume" aria-pressed="false" title="Объёмная сцена (2)">Объём</button>
    </span>
  </div>
  <div class="stage">
    <div class="map-wrap" id="map-wrap">
      <p class="hint" id="scene-hint"></p>
      <div class="map2d" id="map2d"></div>
      <canvas id="scene" hidden></canvas>
    </div>
    <aside class="card" id="panel" aria-live="polite">
      <div class="rh">
        <button class="close" id="close" title="Снять выделение (Esc)" hidden>×</button>
        <div class="kind" id="p-kind"></div>
        <div class="title" id="p-title"></div>
      </div>
      <div class="rb" id="p-body"></div>
    </aside>
  </div>
</section>

<!-- Остальные разделы — страницы: подразделы сверху, содержимое ниже -->
<section class="page" id="view-page" hidden>
  <div class="wrap">
    <div class="subbar">
      <nav class="subnav" id="dock-tabs" aria-label="Подразделы"></nav>
      <span class="spacer"></span>
      <button class="btn sm" id="dock-back" hidden>← назад</button>
      <span class="muted" id="dock-note"></span>
    </div>
    <!-- включённые фильтры эндпоинтов: видно, что включено, и снимается кликом -->
    <div class="chips pad-b" id="active-filters" hidden></div>
    <div id="dock-body"></div>
  </div>
</section>

<div class="palette" id="palette">
  <input type="search" id="pal-q" placeholder="Куда перейти: эндпоинт, таблица, экран, раздел…" autocomplete="off">
  <div class="pal-list" id="pal-list"></div>
</div>

<div id="tip"></div>

<!-- Пути относительные: статический снимок (`veha export-static`) кладут в подкаталог
     сайта, а у сервера страница отдаётся с корня — и там, и там это `static/…`.
     Версию `?v=<хеш содержимого>` к адресам статики ставят сервер и экспорт
     (`veha/viz/assets.py`) — точной заменой строк в двойных кавычках ниже, по одной
     на файл: хостинг может кешировать JS и CSS надолго. -->
<script src="static/api.js"></script>
<script src="static/scene3d.js"></script>
<script src="static/map2d.js"></script>
<script src="static/atlas.js"></script>
<script src="static/dock.js"></script>
</body>
</html>
